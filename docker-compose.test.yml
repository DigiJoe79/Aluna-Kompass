# Testumgebung für die Container Station (QNAP TS-873):
# Container Station → Anwendung erstellen → diesen Inhalt einfügen.
#
# Die Image-Suche der Oberfläche kennt nur Docker Hub; über eine Anwendung
# wird jede Registry gezogen, und ghcr.io/digijoe79/aluna-kompass ist
# öffentlich lesbar, also ohne Anmeldung.
#
# Test und Prod sind bewusst getrennte Anwendungen: so lässt sich Test
# aktualisieren, ohne Prod anzufassen, und die Validierung verlangt nicht
# die Konfiguration der jeweils anderen Umgebung.
#
# Alle Pfade sind absolut, weil die Container Station das Compose nach /tmp
# kopiert und relative env_file-Pfade dort ins Leere zeigen.
#
# Vorher anlegen: /share/Container/kompass-test/{data,media},
# die Datei .env.test (siehe .env.test.example) und secret/site.pw (Rechte 600,
# Besitzer 1000).
services:
  kompass-test:
    # Test folgt dem dev-Branch, Prod dem main-Branch (Tag latest).
    image: ghcr.io/digijoe79/aluna-kompass:dev
    # dev ist ein beweglicher Tag: ohne pull_policy startet Docker das lokal
    # zwischengespeicherte Image weiter, auch nach einer Neubereitstellung.
    pull_policy: always
    container_name: kompass-test
    restart: unless-stopped
    ports: ["3001:3000"]
    environment:
      APP_ENV: test
    env_file: [/share/Container/kompass-test/.env.test]
    volumes:
      # Ein Volume für alles, was gesichert wird: darunter liegt je Modul ein
      # Verzeichnis, `core` hält Datenbank, Mediathek und Basis-Vorlagen.
      - /share/Container/kompass-test/data:/data
      # Geheimnisse ausdrücklich daneben, nie unter /data — das Backup bildet
      # /data ab und darf das Webspace-Passwort nicht mit ausliefern.
      - /share/Container/kompass-test/secret:/secret:ro
