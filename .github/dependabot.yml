# Dependabot hält die Abhängigkeiten aktuell, indem es wöchentlich nachsieht,
# was es Neues gibt, und die Aktualisierung als Pull Request vorschlägt. Die
# CI prüft ihn wie jeden anderen — seit dem 2026-09-15 baut sie dabei auch das
# Image und fährt den Containerring, ein Update kann also nicht an der
# Verpackung scheitern, ohne dass es auffällt.
version: 2
updates:
  # --- npm (der pnpm-Workspace) -------------------------------------------
  # Ein Eintrag genügt: Dependabot liest die Lockfile im Wurzelverzeichnis und
  # sieht darüber alle Pakete des Workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # Mehr als eine Handvoll offener Vorschläge liest ohnehin niemand.
    open-pull-requests-limit: 5
    # Eine Woche Abstand zur Veroeffentlichung: Kompromittierte Pakete fallen
    # meist binnen Tagen auf, und bis dahin soll kein Vorschlag sie bringen.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      # Patch und Minor kommen als **ein** Pull Request. Einzeln wären es
      # zwanzig Stück für dasselbe Ergebnis, und jeder davon kostet einen
      # vollen CI-Lauf.
      routine:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 ist nicht die nächste Fassung von 6, sondern die
      # Portierung nach Go — ein anderes Werkzeug mit eigenem Zeitplan. Der
      # Wechsel ist eine Entscheidung, kein Update. Patches auf der 6er-Linie
      # kommen weiterhin.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # --- GitHub Actions ------------------------------------------------------
  # Die `uses:`-Zeilen in den Workflows. Sie stehen auf Commit-Hashes mit der
  # Fassung als Kommentar; Dependabot schlägt jede neue Fassung vor und
  # aktualisiert Hash und Kommentar zusammen.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Eine Woche Abstand zur Veroeffentlichung: Kompromittierte Pakete fallen
    # meist binnen Tagen auf, und bis dahin soll kein Vorschlag sie bringen.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  # --- Das Basis-Image des Containers -------------------------------------
  # `node:26-bookworm-slim` im Dockerfile. Ein Vorschlag hier ist immer ein
  # Sprung auf die nächste Node-Hauptversion und gehört angesehen, nicht
  # durchgewinkt.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    # Eine Woche Abstand zur Veroeffentlichung: Kompromittierte Pakete fallen
    # meist binnen Tagen auf, und bis dahin soll kein Vorschlag sie bringen.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(image)
