name: CI
on:
  push:
    # Je Fassung ein Arbeitsbranch `dev-x.y.z`; aus jedem Push entsteht das
    # Image `:dev-x.y.z` fuer die Testinstanz (AGENTS.md, Abschnitt Release).
    #
    # `main` steht bewusst nicht hier: Dort landet nur der Squash eines Branches,
    # dessen Inhalt schon getestet ist, und direkt danach kommt der Release-Tag,
    # der alles noch einmal prueft, bevor ein Image entsteht. Mit `main` lief
    # bei 0.1.1 der test-Job zweimal auf demselben Commit. Beitraege von aussen
    # und Dependabot laufen ueber `pull_request`.
    branches: ['dev-*']
    tags: ['v*']
    # Greift nur, wenn *alle* geaenderten Dateien passen; ein gemischter
    # Commit baut weiterhin.
    #
    # `*.md` mit einem Stern trifft nur das Wurzelverzeichnis. `**.md` waere
    # falsch: Es naehme auch `docs/handbuch/**` heraus, und das ist kein
    # Arbeitsdokument, sondern Produktinhalt — der Dockerfile kopiert es ins
    # Image, und `handbook-complete.test.ts` verlangt fuer jede Route eine
    # Seite. Ein Commit, der nur das Handbuch anfasst, muss also bauen.
    paths-ignore:
      - '*.md'
      - 'docs/nordstern.md'
      - 'docker-compose.*.yml'
      - '.env.*.example'
      # Konfiguration von GitHub, nicht des Produkts: Weder Dependabot noch die
      # Issue-Vorlagen aendern, was gebaut oder getestet wird.
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:

# Ein neuer Push verdraengt den laufenden Build desselben Branches, damit nie
# ein aelterer Lauf ein neueres Image unter demselben Tag ueberschreibt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TYPST_VERSION: 0.15.1

# Actions haengen an Commit-Hashes, nicht an Tags: Ein Tag laesst sich
# verschieben, ein Hash nicht. Wird ein Action-Repo uebernommen, liefe sonst
# fremder Code mit dem Recht, Images nach GHCR zu schieben. Der Kommentar nennt
# die Fassung; Dependabot aktualisiert Hash und Kommentar zusammen.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 11.25.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26, cache: pnpm }
      - name: Install Typst and rsync
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst && typst --version
          sudo apt-get update && sudo apt-get install -y rsync
      - name: Texterkennung installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Kein Dev-Ring online (seit 26.09.): Er fuhr dieselbe Suite wie der
      # Container-Ring, nur gegen `next dev` statt gegen den Produktionsbuild,
      # den ein Verein je zu sehen bekommt. Was er fand, fand der dritte Ring
      # auch; was nur in `next dev` bricht, ist ein Entwicklungsproblem und
      # faellt lokal auf, wo jeder in `next dev` arbeitet. Gekostet hat er 54
      # Minuten je Push und den Start des Image-Jobs, der an `needs: test`
      # haengt — und zwei `next dev` nebeneinander sprengten mit 19 GB den
      # Laeufer. Der Dev-Ring bleibt lokal (`pnpm verify`, `pnpm verify:modul`);
      # online prueft die Suite den Container. Spec: Pruefringe, Nachtrag 26.09.

  # Statische Analyse je Push, nicht erst auf `main`: Die Managed Scans der
  # Semgrep-App sahen den Code bislang erst nach dem Squash, also nach dem
  # Release. `semgrep ci` holt Regeln und Blockier-Einstufung aus der Policy im
  # Semgrep-Konto, prueft als Diff gegen den Basis-Commit und meldet dorthin —
  # was dort schon eingeordnet ist, bleibt still. Ohne Token (Pull Requests aus
  # Forks bekommen keine Secrets) laeuft ein Scan mit festen Regelwerken, der
  # meldet, aber nicht blockiert.
  #
  # Das Image ist mit Digest festgenagelt wie die Actions mit Hash, und nicht
  # die juengste Fassung: 1.178.0 war beim Eintragen drei Tage alt, die
  # Lieferkettenregel des Workspace wartet eine Woche (pnpm-workspace.yaml).
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            semgrep ci
          else
            echo "Kein SEMGREP_APP_TOKEN (Fork?) — Scan mit festen Regelwerken, nur meldend."
            semgrep scan --config p/default --config p/secrets --metrics=off
          fi

  image:
    needs: [test, semgrep]
    # Auch bei rotem `test` bauen und gegen den Container prüfen: Sonst kostet
    # jeder Fehlschlag im zweiten Ring eine weitere Runde von einer
    # Viertelstunde, bevor der dritte überhaupt etwas sagen darf. Nur
    # hochgeladen wird das Bild dann nicht — siehe letzter Schritt.
    #
    # Auch bei einem Pull Request: Die Verpackung ist die Schicht, die am
    # 7.9. drei von vier Fehlschlägen verursacht hat, und ein Beitrag von
    # aussen waere sonst gruen, ohne dass je ein Image gebaut wurde. Der
    # Push-Schritt am Ende bleibt auf `push` beschraenkt.
    #
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/aluna-kompass
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            # `latest` entsteht am Release-Tag: Ein Push auf `main` loest die
            # CI nicht aus (siehe `on` oben), und der Tag sitzt immer auf dem
            # Commit, der main's Stand ist.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Erst in den lokalen Daemon laden, nicht sofort pushen: Der Ring gegen
      # den Container ist die einzige Stelle, an der die amd64-Fassung je
      # ausgefuehrt wird — lokal baut ein Apple-Silicon-Rechner arm64, und
      # `better-sqlite3`, `sharp` und Typst sind je Architektur andere Dateien.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kompass-local
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TYPST_VERSION=${{ env.TYPST_VERSION }}
            KOMPASS_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 11.25.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/kompass
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      - run: pnpm --filter @kompass/app exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @kompass/app exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm e2e:image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with: { name: playwright-report-container, path: apps/kompass/playwright-report-container, retention-days: 7 }
      # Wer ein Paket ins Image nimmt, verteilt fremde Software mit. Die
      # Aufstellung entsteht beim Bau im Image; hier faellt auf, wenn sie fehlt
      # oder ein Paket eine Lizenz traegt, die niemand freigegeben hat — vor
      # dem Hochladen, nicht danach. Kein Vergleich mit einer Datei im Repo:
      # Ein Update aendert Versionen, keine Lizenzen.
      - name: Third-party licences in the image are approved
        run: scripts/third-party-notices.sh kompass-local --pruefen
      # Playwright, vitest, eslint und Co. laufen im Container nie; im Image
      # waeren sie nur mitverteilte Angriffsflaeche (Q5).
      - name: Image carries no development tools
        run: scripts/image-runtime-only.sh kompass-local

      # Genau das geprüfte Bild bekommt die Namen und wird hochgeladen — kein
      # zweiter Bau, der sich vom getesteten unterscheiden koennte.
      - name: Push the tested image
        if: ${{ needs.test.result == 'success' && needs.semgrep.result == 'success' && github.event_name == 'push' }}
        run: |
          # GHCR nimmt gelegentlich alle Schichten an und lehnt danach das
          # Manifest mit „unknown blob“ ab: Die letzte, grosse Schicht ist
          # hochgeladen, aber noch nicht verknuepft. Am Bild liegt das nicht —
          # es ist dasselbe, das der Containerring eben geprueft hat. Ein
          # zweiter Anlauf traegt; nach dem dritten bleibt es rot, damit ein
          # echter Fehler nicht in einer Schleife verschwindet.
          push() {
            for attempt in 1 2 3; do
              docker push "$1" && return 0
              echo "Hochladen von $1 fehlgeschlagen (Anlauf $attempt) — neuer Versuch in 15s"
              sleep 15
            done
            return 1
          }
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -z "$tag" ] && continue
            docker tag kompass-local "$tag"
            push "$tag" || exit 1
          done
