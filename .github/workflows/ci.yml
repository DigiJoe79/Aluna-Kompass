name: CI
on:
  push:
    branches: [main, dev]
    tags: ['v*']
    # Greift nur, wenn *alle* geaenderten Dateien passen; ein gemischter
    # Commit baut weiterhin.
    paths-ignore: ['**.md', 'docs/**', 'docker-compose.*.yml', '.env.*.example']
  pull_request:

# Ein neuer Push verdraengt den laufenden Build desselben Branches, damit nie
# ein aelterer Lauf ein neueres Image unter demselben Tag ueberschreibt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TYPST_VERSION: 0.15.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - name: Install Typst and rsync
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst && typst --version
          sudo apt-get update && sudo apt-get install -y rsync
      - name: Texterkennung installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Die Browser sind gross und aendern sich nur mit der Playwright-Version;
      # ohne Cache kostet jeder Lauf eine Minute Download.
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/kompass
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      - run: pnpm --filter @kompass/app exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @kompass/app exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm --filter @kompass/app e2e
      # Der Bericht entsteht nur, weil playwright.config.ts den HTML-Reporter
      # fuehrt; ohne ihn lud dieser Schritt ein leeres Artefakt hoch.
      - uses: actions/upload-artifact@v5
        if: failure()
        with: { name: playwright-report, path: apps/kompass/playwright-report, retention-days: 7 }

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/aluna-kompass
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      # Erst in den lokalen Daemon laden, nicht sofort pushen: Der Ring gegen
      # den Container ist die einzige Stelle, an der die amd64-Fassung je
      # ausgefuehrt wird — lokal baut ein Apple-Silicon-Rechner arm64, und
      # `better-sqlite3`, `sharp` und Typst sind je Architektur andere Dateien.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kompass-local
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TYPST_VERSION=${{ env.TYPST_VERSION }}
            KOMPASS_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/kompass
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      - run: pnpm --filter @kompass/app exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @kompass/app exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm e2e:image
      - uses: actions/upload-artifact@v5
        if: failure()
        with: { name: playwright-report-container, path: apps/kompass/playwright-report-container, retention-days: 7 }
      # Genau das geprüfte Bild bekommt die Namen und wird hochgeladen — kein
      # zweiter Bau, der sich vom getesteten unterscheiden koennte.
      - name: Push the tested image
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -z "$tag" ] && continue
            docker tag kompass-local "$tag"
            docker push "$tag"
          done
