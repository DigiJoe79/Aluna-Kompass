# Produktionsumgebung. Vorlage — die Pfade unten sind Beispiele und werden auf die
# eigenen angepasst.
#
# Vorher anlegen: ein Verzeichnis für die Daten, eines für die Medien, die
# Datei .env.prod (siehe .env.prod.example) und — nur wenn die Webseite von
# hier aus veröffentlicht wird — secret/site.pw (Rechte 600, Besitzer 1000).
# Das Verzeichnis `secret` liegt **neben** den Daten, nicht darin: Das Backup
# bildet die Daten ab, und ein Geheimnis darf in kein Archiv geraten.
#
# Test und Produktion sind bewusst getrennte Anwendungen: So lässt sich der
# Test aktualisieren, ohne die Produktion anzufassen.
#
# Die Pfade sind absolut. Manche Oberflächen — etwa die Container Station von
# QNAP — kopieren das Compose vor dem Start nach /tmp, und ein relativer
# `env_file`-Pfad zeigt dort ins Leere.
#
# `ghcr.io/digijoe79/aluna-kompass` ist öffentlich lesbar, eine Anmeldung an
# der Registry ist also nicht nötig.
services:
  kompass-prod:
    # Prod folgt dem main-Branch; das Tag latest entsteht beim Push eines
    # Release-Tags (v*), nicht bei jedem main-Commit — main bekommt nach dem
    # Schnitt ohnehin nur Squash-Merges aus geprüften PRs.
    image: ghcr.io/digijoe79/aluna-kompass:latest
    # latest ist ebenfalls beweglich; bei einem Update soll das neue Image
    # gezogen werden, nicht das zwischengespeicherte starten.
    pull_policy: always
    container_name: kompass-prod
    restart: unless-stopped
    # Beim Stopp schliesst Kompass die Datenbank und überträgt dabei die
    # Nebendatei kompass.db-wal in kompass.db. Docker wartet sonst nur 10 s und
    # beendet dann hart; die Frist gilt auch für die Container Station.
    stop_grace_period: 60s
    # Vor der Einrichtung nimmt Kompass den ersten Nutzer von jedem an, der die
    # Adresse erreicht — vorher gibt es niemanden, an dem sich das pruefen liesse.
    # Wer nicht ausschliessen kann, dass in dieser Zeit jemand anders zugreift,
    # bindet den Port bis dahin lokal: ["127.0.0.1:3000:3000"]. Siehe betrieb.md.
    ports: ["3000:3000"]
    environment:
      APP_ENV: production
    env_file: [/pfad/zu/kompass-prod/.env.prod]
    volumes:
      # Ein Volume für alles, was gesichert wird: darunter liegt je Modul ein
      # Verzeichnis, `core` hält Datenbank, Mediathek und Basis-Vorlagen.
      - /pfad/zu/kompass-prod/data:/data
      # Geheimnisse ausdrücklich daneben, nie unter /data — das Backup bildet
      # /data ab und darf das Webspace-Passwort nicht mit ausliefern.
      - /pfad/zu/kompass-prod/secret:/secret:ro

# Die MTU des Netzes liegt unter dem Docker-Standard von 1500. Auf manchen
# Anschlüssen (PPPoE, Tunnel) ist die Pfad-MTU kleiner, und die Rückmeldung
# „Paket zu groß“ erreicht den Container nicht. Dann bleiben große Pakete
# stumm hängen: Der SSH-Schlüsselaustausch beim Veröffentlichen bricht ab, kleine
# Verbindungen laufen weiter. 1400 lässt Luft unter jedem üblichen Anschluss.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
